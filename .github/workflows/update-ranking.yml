name: Update BLANK Riot Ranking (Every 6h)

on:
  schedule:
    # Se ejecuta cada 6 horas en punto (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón cuando quieras

permissions:
  contents: write

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Ejecutar script Riot API
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: node scripts/fetch-riot-ranking.js

      - name: Guardar y commitear cambios
        run: |
          git config --global user.name "BLANK Bot"
          git config --global user.email "bot@blvnk.ca"
          git add data/ranking.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Riot Leaderboard Sync [skip ci]" && git push)
